# Network tuning for Orange Pi 6 Plus nodes (5 GbE), installed as /etc/sysctl.d/90-kudalite.conf
# by deploy/install.sh --tune-network (recommended on this board). At 5 Gb/s a single TCP stream
# needs a much larger window than at 1 Gb/s to stay full, and the NIC delivers packets faster
# than the default backlog drains. Safe on a dedicated cluster network.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 262144 67108864
net.ipv4.tcp_wmem = 4096 262144 67108864
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 4096
net.ipv4.tcp_mtu_probing = 1
