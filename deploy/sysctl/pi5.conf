# Network tuning for Raspberry Pi 5 nodes (1 GbE), installed as /etc/sysctl.d/90-kudalite.conf
# by deploy/install.sh --tune-network. Lets TCP windows grow enough to keep 1 GbE (or a 2.5 GbE
# HAT) full on multi-megabyte data-plane transfers. Safe defaults for a dedicated cluster network.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 131072 16777216
net.core.somaxconn = 1024
