# /etc/kudalite/worker.conf — options for cl-worker (same names as its --options).
# Lines are "key = value"; '#' starts a comment. Command-line options override this file.

# Controller's worker port (host:port). deploy/install.sh fills this in from --controller.
controller = @CONTROLLER@:7071

# Data plane: other workers and the controller read and write this worker's memory here.
bind = 0.0.0.0
data-port = 7100

# Address other nodes should use to reach this worker. Leave unset to use the address this board
# uses to reach the controller (right for a single cluster network). On boards with two ports
# (Orange Pi 6 Plus) set it to the cluster-port address if the other port is also connected.
# advertise = 10.0.0.11

# RAM contributed to cluster global memory, and the remote-page cache budget. Unset = 60% and
# 15% of this board's RAM: 4.8 GiB / 1.2 GiB on an 8 GB Raspberry Pi 5, 38 GiB / 9.6 GiB on a
# 64 GB Orange Pi 6 Plus. Accepts K, M, G suffixes.
# mem = 4800M
# cache = 1200M

# Compute threads for kernels. Unset = all cores: 4 on a Raspberry Pi 5, 12 on an Orange Pi 6
# Plus (8 x Cortex-A720 + 4 x Cortex-A520; work is handed out dynamically, so the slower A520
# cores simply take fewer chunks).
# threads = 4

# Telemetry push period in ms (0 = off).
telemetry-ms = 1000

# debug | info | warn | error  (journalctl -u kudalite-worker)
log-level = info
