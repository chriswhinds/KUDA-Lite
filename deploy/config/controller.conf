# /etc/kudalite/controller.conf — options for cl-controller (same names as its --options).
# Lines are "key = value"; '#' starts a comment. Command-line options override this file.

# Address to listen on. 0.0.0.0 = all interfaces; set a specific address to keep the cluster
# off other networks (e.g. the Pi's address on the cluster switch).
bind = 0.0.0.0

# Host runtimes (your programs, cl-info, the dashboard) connect here.
host-port = 7070

# Workers register here.
worker-port = 7071

# Default striping page for clMalloc (multiple of 64). Larger = fewer, bigger network messages.
page-size = 64K

# Block chunks handed to each worker per launch; higher balances better, costs more RPCs.
chunk-factor = 4

# Telemetry: controller self-sampling period, and samples kept per node (600 = 10 min at 1 s).
telemetry-ms = 1000
telemetry-history = 600

# debug | info | warn | error  (logs go to the journal: journalctl -u kudalite-controller)
log-level = info
